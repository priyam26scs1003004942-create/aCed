<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aCed - Alerts</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Pacifico&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #1e3a8a; --primary-light: #eef2ff; --bg-body: #f1f5f9; --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0; --danger: #ef4444; --radius: 12px; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
    .app-container { width: 100%; height: 100vh; max-width: 100%; background-color: var(--bg-body); display: flex; flex-direction: column; position: relative; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
    @media (min-width: 768px) { body { padding: 16px 0; } .app-container { max-width: 900px; height: 88vh; border-radius: 20px; overflow: hidden; } }

    header { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: #ffffff; border-bottom: 1px solid var(--border-color); z-index: 10; }
    .icon-btn { background: none; border: none; font-size: 1.15rem; color: var(--text-main); cursor: pointer; display: flex; align-items: center; width: 36px; text-decoration: none; }
    .brand-title { font-family: 'Pacifico', cursive; font-size: 1.5rem; letter-spacing: 0.5px; display: flex; align-items: center; padding-bottom: 2px; }
    .college-logo-img { height: 30px; width: auto; max-width: 100px; object-fit: contain; }

    main { flex-grow: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .alerts-header-row { display: flex; justify-content: space-between; align-items: center; }
    .alerts-title { font-size: 1.15rem; font-weight: 600; color: var(--text-main); }
    .filter-trigger-btn { background: #ffffff; border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    
    .filter-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .filter-chips::-webkit-scrollbar { display: none; }
    .chip { background: #ffffff; border: 1px solid var(--border-color); padding: 5px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
    .chip.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }

    .empty-state-container { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 20px; }
    .empty-state-container i { font-size: 3.5rem; color: #cbd5e1; margin-bottom: 12px; }
    .empty-state-container h3 { font-size: 1rem; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
    .empty-state-container p { font-size: 0.8rem; color: var(--text-muted); max-width: 260px; line-height: 1.5; }

    .bottom-nav { flex-shrink: 0; width: 100%; height: 65px; background: #ffffff; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 20; }
    .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: var(--text-muted); font-size: 0.65rem; gap: 4px; flex: 1; height: 100%; }
    .nav-item i { font-size: 1.05rem; }
    .nav-item.active { color: var(--primary); font-weight: 600; }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <a href="index.html" class="icon-btn" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="brand-title">
        <span style="color: var(--primary);">a</span><span style="color: var(--danger);">Ced</span>
      </div>
      <a href="https://iilm.edu" target="_blank" class="college-logo-link">
        <img src="iilm webp.jpeg" alt="IILM" class="college-logo-img" />
      </a>
    </header>

    <main>
      <div class="alerts-header-row">
        <h2 class="alerts-title">Notifications</h2>
        <button class="filter-trigger-btn"><i class="fa-solid fa-sliders"></i> Filter</button>
      </div>
      <div class="filter-chips">
        <div class="chip active">All</div><div class="chip">Urgent</div><div class="chip">Academic</div><div class="chip">System</div>
      </div>
      <div class="empty-state-container">
        <i class="fa-regular fa-bell-slash"></i>
        <h3>No new alerts</h3>
        <p>You're all caught up! When there are new updates, they will appear here.</p>
      </div>
    </main>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
      <a href="doubts.html" class="nav-item"><i class="fa-regular fa-comments"></i><span>Doubts</span></a>
      <a href="course.html" class="nav-item"><i class="fa-solid fa-book-open"></i><span>Courses</span></a>
      <a href="alert.html" class="nav-item active"><i class="fa-regular fa-bell"></i><span>Alerts</span></a>
      <a href="profile.html" class="nav-item"><i class="fa-regular fa-user"></i><span>Profile</span></a>
    </nav>
  </div>
</body>
</html>
